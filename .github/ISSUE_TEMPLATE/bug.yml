name: Bug report
description: Report an Android integration, application or correction regression
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Do not paste private messages, emails, credentials, personal documents
        or other sensitive text. Use a short synthetic reproduction instead.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Native SpellCheckerService
        - ACTION_PROCESS_TEXT
        - Grammalecte IME / InputConnection
        - Correction engine / suggestions
        - Application UI / setup
        - Build / installation
        - Other
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android / ROM version
      placeholder: "Android 14 / Samsung One UI 6.1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Samsung Galaxy S21"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Grammalecte Android version or commit
      placeholder: "0.1.0-dev / commit abc1234"
    validations:
      required: true

  - type: input
    id: target_application
    attributes:
      label: Application where the issue occurs
      description: Leave empty if the issue is not application-specific.
      placeholder: "Firefox 143 / Samsung Notes ..."

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic French text and list the exact steps.
      placeholder: |
        Synthetic text: Je suis aller au magasin.

        1. Select the sentence.
        2. Switch to the Grammalecte IME.
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private text, identifiers, credentials and unrelated device data before posting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed private or personally identifiable text from this report.
          required: true
