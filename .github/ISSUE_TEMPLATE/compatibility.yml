name: Compatibility report
description: Report how Grammalecte Android behaves in a specific Android application
title: "compat: "
body:
  - type: markdown
    attributes:
      value: |
        Compatibility reports help build the public application matrix.

        Do not include real messages, emails or other private text.
        Use synthetic test sentences only.

  - type: input
    id: android
    attributes:
      label: Android / ROM version
      placeholder: "Android 14 / Samsung One UI 6.1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "Samsung Galaxy S21"
    validations:
      required: true

  - type: input
    id: grammalecte_version
    attributes:
      label: Grammalecte Android version or commit
      placeholder: "0.1.0-dev / commit abc1234"
    validations:
      required: true

  - type: input
    id: application
    attributes:
      label: Tested application
      placeholder: "Firefox"
    validations:
      required: true

  - type: input
    id: application_version
    attributes:
      label: Tested application version
      placeholder: "143.0"
    validations:
      required: true

  - type: dropdown
    id: paths
    attributes:
      label: Integration paths tested
      multiple: true
      options:
        - Native SpellCheckerService
        - ACTION_PROCESS_TEXT
        - Grammalecte IME / InputConnection
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Works correctly
        - Works with limitations
        - Does not work
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe which correction paths work and which do not.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Test procedure
      description: Describe the synthetic test text and steps used.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no private or personally identifiable user text.
          required: true
