version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 3

    labels:
      - dependencies

    ignore:
      # The wrapper version is deliberately kept in sync with
      # CI and tools/bootstrap-gradle-wrapper.sh, including its SHA-256.
      # Upgrade it manually as one reviewed change.
      - dependency-name: gradle-wrapper

    groups:
      gradle-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 2

    labels:
      - dependencies

    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
