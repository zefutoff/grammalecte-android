name: Vendored engine smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - 'tools/grammalecte.env'
      - 'tools/vendor-grammalecte.sh'
      - 'engine-grammalecte/**'
      - '.github/workflows/engine-smoke.yml'

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Generate pinned Grammalecte assets
        run: ./tools/vendor-grammalecte.sh

      - name: Verify upstream stamp
        run: ./tools/check-vendor.sh

      - name: Build with embedded engine
        run: gradle --no-daemon :engine-grammalecte:test :app:assembleDebug
