name: Vendored engine smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - 'tools/grammalecte.env'
      - 'tools/vendor-grammalecte.sh'
      - 'tools/check-vendor.sh'
      - 'engine-grammalecte/**'
      - 'third_party/grammalecte/**'
      - '.github/workflows/engine-smoke.yml'

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      - name: Verify committed upstream metadata
        run: ./tools/check-vendor.sh

      - name: Generate pinned Grammalecte assets
        run: ./tools/vendor-grammalecte.sh

      - name: Verify regenerated upstream metadata
        run: ./tools/check-vendor.sh

      - name: Verify vendored assets are reproducible
        run: |
          git diff --exit-code -- \
            engine-grammalecte/src/main/assets/grammalecte \
            third_party/grammalecte

      - name: Build with embedded engine
        run: ./gradlew --no-daemon :engine-grammalecte:test :app:assembleDebug
