name: Signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build signed release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GRAMMALECTE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/grammalecte-release.keystore"
          chmod 600 "$RUNNER_TEMP/grammalecte-release.keystore"

      - name: Build and sign release APK
        env:
          GRAMMALECTE_SIGNING_KEYSTORE: ${{ runner.temp }}/grammalecte-release.keystore
          GRAMMALECTE_SIGNING_KEY_ALIAS: ${{ secrets.GRAMMALECTE_SIGNING_KEY_ALIAS }}
          GRAMMALECTE_SIGNING_STORE_PASSWORD: ${{ secrets.GRAMMALECTE_SIGNING_STORE_PASSWORD }}
          GRAMMALECTE_SIGNING_KEY_PASSWORD: ${{ secrets.GRAMMALECTE_SIGNING_KEY_PASSWORD }}
        run: make signed-release

      - name: Generate and validate runtime SBOM
        run: make sbom

      - name: Record release checksums
        run: |
          sha256sum \
            app/build/outputs/apk/release/app-release-signed.apk \
            > app/build/outputs/apk/release/app-release-signed.apk.sha256

          sha256sum \
            build/reports/sbom/grammalecte-android.cdx.json \
            > build/reports/sbom/grammalecte-android.cdx.json.sha256

          cat app/build/outputs/apk/release/app-release-signed.apk.sha256
          cat build/reports/sbom/grammalecte-android.cdx.json.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grammalecte-android-signed-release
          path: |
            app/build/outputs/apk/release/app-release-signed.apk
            app/build/outputs/apk/release/app-release-signed.apk.sha256
            build/reports/sbom/grammalecte-android.cdx.json
            build/reports/sbom/grammalecte-android.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/grammalecte-release.keystore"
