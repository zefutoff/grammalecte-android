name: Android instrumentation

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 6'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'engine-grammalecte/**'
      - 'spellchecker/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
      - '.github/workflows/instrumentation.yml'

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(github.event_name == 'pull_request' && '[35]' || '[26,30,35]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Assemble instrumentation APKs
        run: |
          ./gradlew --no-daemon \
            :spellchecker:assembleDebugAndroidTest \
            :app:assembleDebugAndroidTest

      - name: Run connected tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            ./gradlew --no-daemon --no-parallel :spellchecker:connectedDebugAndroidTest
            ./gradlew --no-daemon --no-parallel :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            spellchecker/build/reports/androidTests/connected/debug/
            spellchecker/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: ignore
          retention-days: 14
