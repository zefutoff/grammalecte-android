name: Android instrumentation

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 6'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'engine-grammalecte/**'
      - 'spellchecker/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
      - 'Makefile'
      - '.github/workflows/instrumentation.yml'

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(github.event_name == 'pull_request' && '["26","35","37.0"]' || '["26","30","35","37.0"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Assemble instrumentation APKs
        run: |
          ./gradlew --no-daemon \
            :spellchecker:assembleDebugAndroidTest \
            :app:assembleDebugAndroidTest

      - name: Install compatible AVD tooling for Android 17
        if: matrix.api-level == '37.0'
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'cmdline-tools;22.0'
          test -x "$SDK/cmdline-tools/22.0/bin/avdmanager"
          mv "$SDK/cmdline-tools/latest" "$SDK/cmdline-tools/previous-latest"
          ln -s "$SDK/cmdline-tools/22.0" "$SDK/cmdline-tools/latest"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Run connected tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level == '37.0' && 'google_apis' || 'default' }}
          emulator-build: ${{ matrix.api-level == '37.0' && '15507667' || '' }}
          disable-spellchecker: false
          disable-animations: true
          pre-emulator-launch-script: |
            grep '^target=' "$ANDROID_AVD_HOME/test.ini"
            test "${{ matrix.api-level }}" != '37.0' || grep -qx 'target=android-37.0' "$ANDROID_AVD_HOME/test.ini"
          script: |
            make instrumented

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            spellchecker/build/reports/androidTests/connected/debug/
            spellchecker/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: ignore
          retention-days: 14
