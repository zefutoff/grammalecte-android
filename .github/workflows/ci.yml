name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic

      - name: Check privacy invariant
        run: ./tools/check-no-network-permission.sh

      - name: Check shell scripts
        run: shellcheck tools/*.sh

      - name: Test JavaScript bridge contract
        run: node tools/test-js-bridge.mjs

      - name: Kotlin formatting and unit tests
        run: gradle --no-daemon ktlintCheck :core:test :engine-grammalecte:test :spellchecker:test

      - name: Android lint and debug build
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grammalecte-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
