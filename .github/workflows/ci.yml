name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          cache-provider: basic

      - name: Check privacy invariant
        run: ./tools/check-no-network-permission.sh

      - name: Check shell scripts
        run: shellcheck tools/*.sh

      - name: Test JavaScript bridge contract
        run: node tools/test-js-bridge.mjs

      - name: Kotlin formatting and unit tests
        run: ./gradlew --no-daemon ktlintCheck :core:test :engine-grammalecte:test :spellchecker:test

      - name: Android lint and debug build
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: grammalecte-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
